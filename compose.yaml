services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15

  kafka:
    # Imagem padrão sobe em modo KRaft de nó único anunciando localhost:9092.
    image: apache/kafka-native:4.3.1
    ports:
      - "9092:9092"
