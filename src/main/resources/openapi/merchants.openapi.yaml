openapi: 3.0.3
info:
  title: PiggiesMerchantService
  version: 0.1.0
  description: |
    Valida o merchant e registra o crédito. Merchant ACTIVE segue no fluxo.
    INACTIVE ou CNPJ desconhecido interrompem o pagamento.

    Entidades persistidas no schema spp_merchant: Merchant e Receivable.

    paymentIntentId é único no recebível. Repetir o crédito devolve o mesmo
    Receivable sem criar outra linha.

    Consome spp.payment.confirm e publica spp.payment.confirmed depois do crédito.
servers:
  - url: http://localhost:8080
    description: Processo local do SPP
tags:
  - name: merchants
    description: Validação do merchant e crédito
paths:
  /v1/merchants/validate:
    post:
      operationId: validateMerchant
      tags: [merchants]
      summary: Valida se o merchant pode receber Piggies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateMerchantRequest"
            example:
              merchantCnpj: "12345678000199"
      responses:
        "200":
          description: Merchant ativo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
              example:
                id: "6ba7b812-9dad-11d1-80b4-00c04fd430c8"
                name: Merchant X
                cnpj: "12345678000199"
                agency: "0001"
                accountNumber: "000999"
                status: ACTIVE
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: CNPJ sem cadastro.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: "about:blank"
                title: Merchant não encontrado
                status: 404
                detail: Não há merchant para o CNPJ informado
        "422":
          description: Merchant cadastrado com status INACTIVE.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: "about:blank"
                title: Merchant inativo
                status: 422
                detail: O merchant não está ativo para receber Piggies
  /v1/credits:
    post:
      operationId: createCredit
      tags: [merchants]
      summary: Registra o recebível e credita o merchant
      description: |
        Grava um Receivable CREDITED para um merchant ACTIVE. O mesmo
        paymentIntentId devolve o recebível já gravado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCreditRequest"
            example:
              paymentIntentId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
              merchantCnpj: "12345678000199"
              amount: 100
      responses:
        "201":
          description: Recebível criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receivable"
              example:
                id: "6ba7b813-9dad-11d1-80b4-00c04fd430c8"
                paymentIntentId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                merchantId: "6ba7b812-9dad-11d1-80b4-00c04fd430c8"
                amount: 100
                status: CREDITED
                creditedAt: "2026-09-24T19:46:02Z"
        "200":
          description: Já existia recebível para este paymentIntentId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receivable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: CNPJ sem cadastro.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: "about:blank"
                title: Merchant não encontrado
                status: 404
                detail: Não há merchant para o CNPJ informado
        "422":
          description: Merchant inativo. Nenhum recebível é criado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: "about:blank"
                title: Merchant inativo
                status: 422
                detail: O merchant não está ativo para receber Piggies
components:
  responses:
    BadRequest:
      description: Campo inválido, como CNPJ fora do formato ou amount menor que 1.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "about:blank"
            title: Requisição inválida
            status: 400
            detail: merchantCnpj deve ter 14 dígitos
  schemas:
    ValidateMerchantRequest:
      type: object
      additionalProperties: false
      required:
        - merchantCnpj
      properties:
        merchantCnpj:
          type: string
          description: CNPJ do Merchant, só dígitos.
          pattern: "^[0-9]{14}$"
          example: "12345678000199"
    CreateCreditRequest:
      type: object
      additionalProperties: false
      required:
        - paymentIntentId
        - merchantCnpj
        - amount
      properties:
        paymentIntentId:
          type: string
          format: uuid
          description: Id da PaymentIntent. Chave de idempotência do recebível.
        merchantCnpj:
          type: string
          pattern: "^[0-9]{14}$"
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Piggies a creditar.
          example: 100
    Merchant:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - cnpj
        - agency
        - accountNumber
        - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Merchant X
        cnpj:
          type: string
          pattern: "^[0-9]{14}$"
          description: Único.
        agency:
          type: string
          example: "0001"
        accountNumber:
          type: string
          description: Conta em que o crédito é registrado.
          example: "000999"
        status:
          $ref: "#/components/schemas/MerchantStatus"
    MerchantStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
    Receivable:
      type: object
      additionalProperties: false
      required:
        - id
        - paymentIntentId
        - merchantId
        - amount
        - status
        - creditedAt
      properties:
        id:
          type: string
          format: uuid
        paymentIntentId:
          type: string
          format: uuid
          description: Único. Impede crédito duplo do mesmo pagamento.
        merchantId:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: "#/components/schemas/ReceivableStatus"
        creditedAt:
          type: string
          format: date-time
    ReceivableStatus:
      type: string
      enum:
        - CREDITED
    PaymentConfirmEvent:
      type: object
      additionalProperties: false
      description: |
        Consumido no tópico spp.payment.confirm. O consumer credita de forma
        idempotente e em seguida publica PaymentConfirmedEvent.
      required:
        - paymentId
        - reservationId
        - merchantCnpj
        - amount
      properties:
        paymentId:
          type: string
          format: uuid
        reservationId:
          type: string
          format: uuid
        merchantCnpj:
          type: string
          pattern: "^[0-9]{14}$"
        amount:
          type: integer
          format: int64
          minimum: 1
    PaymentConfirmedEvent:
      type: object
      additionalProperties: false
      description: Publicado no tópico spp.payment.confirmed depois do crédito.
      required:
        - paymentId
        - merchantCnpj
        - amount
        - creditedAt
      properties:
        paymentId:
          type: string
          format: uuid
        merchantCnpj:
          type: string
          pattern: "^[0-9]{14}$"
        amount:
          type: integer
          format: int64
          minimum: 1
        creditedAt:
          type: string
          format: date-time
    Problem:
      type: object
      description: RFC 9457 application/problem+json
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
