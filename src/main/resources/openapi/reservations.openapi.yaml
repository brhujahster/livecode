openapi: 3.0.3
info:
  title: PiggiesReserveService
  version: 0.1.0
  description: |
    Reserva o saldo do cliente e confirma o débito. Disponível =
    balance − reservedBalance.

    Entidades persistidas no schema spp_reserve: Client, Account e Reservation.
    Client e Account não têm endpoint próprio nesta versão; a reserva localiza
    a conta por CPF, agência e número.

    paymentIntentId é único. Repetir a criação, a confirmação ou a liberação
    com o mesmo pagamento não move saldo de novo.

    Liberar uma reserva CONFIRMED responde 409. Não há estorno depois do débito.
servers:
  - url: http://localhost:8080
    description: Processo local do SPP
tags:
  - name: reservations
    description: Reserva e débito do cliente
paths:
  /v1/reservations:
    post:
      operationId: createReservation
      tags: [reservations]
      summary: Reserva Piggies na conta do cliente
      description: |
        Aumenta reservedBalance quando o disponível cobre o amount. A reserva
        nasce em RESERVED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
            example:
              paymentIntentId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
              payerCpf: "12345678901"
              payerAgency: "0001"
              payerAccount: "000123"
              amount: 100
      responses:
        "201":
          description: Reserva criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
              example:
                id: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
                paymentIntentId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                accountId: "6ba7b811-9dad-11d1-80b4-00c04fd430c8"
                amount: 100
                status: RESERVED
                createdAt: "2026-09-24T19:46:01Z"
        "200":
          description: Já existia reserva para este paymentIntentId. O saldo não muda.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Conta do cliente não encontrada.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: "about:blank"
                title: Conta não encontrada
                status: 404
                detail: Não há conta para o CPF, agência e número informados
        "422":
          description: Disponível insuficiente para o amount.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: "about:blank"
                title: Saldo insuficiente
                status: 422
                detail: O disponível da conta é menor que o valor da reserva
  /v1/reservations/{id}/confirm:
    post:
      operationId: confirmReservation
      tags: [reservations]
      summary: Confirma o débito da reserva
      description: |
        Tira o amount de balance e de reservedBalance. A reserva passa a
        CONFIRMED. Chamar de novo devolve a mesma reserva sem debitar outra vez.
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: Débito confirmado, ou confirmação já aplicada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
              example:
                id: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
                paymentIntentId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                accountId: "6ba7b811-9dad-11d1-80b4-00c04fd430c8"
                amount: 100
                status: CONFIRMED
                createdAt: "2026-09-24T19:46:01Z"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A reserva já foi liberada e não pode ser debitada.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: "about:blank"
                title: Transição inválida
                status: 409
                detail: Reserva liberada não pode ser confirmada
  /v1/reservations/{id}/release:
    post:
      operationId: releaseReservation
      tags: [reservations]
      summary: Libera uma reserva ainda não debitada
      description: |
        Devolve o amount apenas em reservedBalance. balance não muda. A reserva
        passa a RELEASED. Usada quando a validação do merchant falha.
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: Reserva liberada, ou liberação já aplicada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
              example:
                id: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
                paymentIntentId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                accountId: "6ba7b811-9dad-11d1-80b4-00c04fd430c8"
                amount: 100
                status: RELEASED
                createdAt: "2026-09-24T19:46:01Z"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A reserva já foi confirmada. Não há cancelamento depois do débito.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: "about:blank"
                title: Transição inválida
                status: 409
                detail: Reserva confirmada não pode ser liberada
components:
  parameters:
    ReservationId:
      name: id
      in: path
      required: true
      description: Id da Reservation.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Campo inválido, como amount menor que 1.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "about:blank"
            title: Requisição inválida
            status: 400
            detail: amount deve ser um inteiro maior que zero
    NotFound:
      description: Reserva não encontrada.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "about:blank"
            title: Reserva não encontrada
            status: 404
            detail: Não existe reserva para o id informado
  schemas:
    CreateReservationRequest:
      type: object
      additionalProperties: false
      required:
        - paymentIntentId
        - payerCpf
        - payerAgency
        - payerAccount
        - amount
      properties:
        paymentIntentId:
          type: string
          format: uuid
          description: Id da PaymentIntent. Chave de idempotência da reserva.
        payerCpf:
          type: string
          description: CPF do Client dono da conta, só dígitos.
          pattern: "^[0-9]{11}$"
          example: "12345678901"
        payerAgency:
          type: string
          minLength: 1
          maxLength: 4
          description: Agência da Account.
          example: "0001"
        payerAccount:
          type: string
          minLength: 1
          maxLength: 20
          description: Número da Account.
          example: "000123"
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Piggies a reservar.
          example: 100
    Reservation:
      type: object
      additionalProperties: false
      required:
        - id
        - paymentIntentId
        - accountId
        - amount
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        paymentIntentId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
          description: Account em que reservedBalance e balance foram movimentados.
        amount:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: "#/components/schemas/ReservationStatus"
        createdAt:
          type: string
          format: date-time
    ReservationStatus:
      type: string
      enum:
        - RESERVED
        - CONFIRMED
        - RELEASED
    Client:
      type: object
      additionalProperties: false
      description: Titular persistido pelo reserve. Sem endpoint nesta versão.
      required:
        - id
        - name
        - cpf
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Cliente A
        cpf:
          type: string
          pattern: "^[0-9]{11}$"
          description: Único.
    Account:
      type: object
      additionalProperties: false
      description: |
        Conta do cliente. Disponível = balance − reservedBalance.
        Sem endpoint nesta versão; a reserva devolve accountId.
      required:
        - id
        - clientId
        - agency
        - number
        - balance
        - reservedBalance
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        agency:
          type: string
          example: "0001"
        number:
          type: string
          description: Número da conta.
          example: "000123"
        balance:
          type: integer
          format: int64
          minimum: 0
          description: Saldo liquidado, em Piggies.
        reservedBalance:
          type: integer
          format: int64
          minimum: 0
          description: Soma das reservas ainda em RESERVED.
    Problem:
      type: object
      description: RFC 9457 application/problem+json
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
