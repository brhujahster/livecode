openapi: 3.0.3
info:
  title: PiggiesPaymentCoordinator
  version: 0.1.0
  description: |
    Borda do app. Registra a intenção de pagamento e devolve 202 antes de
    reservar saldo, validar o merchant e confirmar.

    O header Idempotency-Key é o id da PaymentIntent. Reenviar a mesma chave
    devolve a intenção já existente, sem abrir outra jornada.

    Entidade persistida no schema spp_coordinator: PaymentIntent.

    Evento publicado em spp.payment.confirm quando a reserva e a validação
    concluem. Evento consumido em spp.payment.confirmed para fechar a intenção.
servers:
  - url: http://localhost:8080
    description: Processo local do SPP
tags:
  - name: payments
    description: Intenção de pagamento
paths:
  /v1/payments:
    post:
      operationId: createPayment
      tags: [payments]
      summary: Inicia um pagamento
      description: |
        Persiste a intenção em PROCESSING e responde 202. Reserva, validação
        e confirmação acontecem depois desta resposta.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
            example:
              payerCpf: "12345678901"
              payerAgency: "0001"
              payerAccount: "000123"
              merchantCnpj: "12345678000199"
              amount: 100
      responses:
        "202":
          description: Intenção registrada. O status pode já estar adiantado quando a chave é reenviada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentAccepted"
              example:
                paymentId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                status: PROCESSING
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/payments/{id}:
    get:
      operationId: getPayment
      tags: [payments]
      summary: Consulta a intenção de pagamento
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Estado atual da intenção
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                payerCpf: "12345678901"
                payerAgency: "0001"
                payerAccount: "000123"
                merchantCnpj: "12345678000199"
                amount: 100
                status: CONFIRMED
                reservationId: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
                failureReason: null
                createdAt: "2026-09-24T19:46:00Z"
                updatedAt: "2026-09-24T19:46:02Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID da intenção. Repetir a chave devolve o pagamento já criado.
      schema:
        type: string
        format: uuid
    PaymentId:
      name: id
      in: path
      required: true
      description: Id da PaymentIntent, igual ao Idempotency-Key enviado na criação.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Campo inválido, como amount menor que 1 ou documento fora do formato.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "about:blank"
            title: Requisição inválida
            status: 400
            detail: amount deve ser um inteiro maior que zero
    NotFound:
      description: Intenção não encontrada.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "about:blank"
            title: Pagamento não encontrado
            status: 404
            detail: Não existe intenção para o id informado
  schemas:
    CreatePaymentRequest:
      type: object
      additionalProperties: false
      description: QR já decodificado mais o pagador conhecido pelo app.
      required:
        - payerCpf
        - payerAgency
        - payerAccount
        - merchantCnpj
        - amount
      properties:
        payerCpf:
          type: string
          description: CPF do cliente pagador, só dígitos.
          pattern: "^[0-9]{11}$"
          example: "12345678901"
        payerAgency:
          type: string
          minLength: 1
          maxLength: 4
          example: "0001"
        payerAccount:
          type: string
          minLength: 1
          maxLength: 20
          example: "000123"
        merchantCnpj:
          type: string
          description: CNPJ do merchant identificado no QR, só dígitos.
          pattern: "^[0-9]{14}$"
          example: "12345678000199"
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Quantidade inteira de Piggies.
          example: 100
    PaymentAccepted:
      type: object
      additionalProperties: false
      description: Resposta imediata da borda. paymentId é o Idempotency-Key.
      required:
        - paymentId
        - status
      properties:
        paymentId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/PaymentStatus"
    PaymentIntent:
      type: object
      additionalProperties: false
      description: Intenção de pagamento persistida pelo coordinator.
      required:
        - id
        - payerCpf
        - payerAgency
        - payerAccount
        - merchantCnpj
        - amount
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        payerCpf:
          type: string
          pattern: "^[0-9]{11}$"
        payerAgency:
          type: string
        payerAccount:
          type: string
        merchantCnpj:
          type: string
          pattern: "^[0-9]{14}$"
        amount:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: "#/components/schemas/PaymentStatus"
        reservationId:
          type: string
          format: uuid
          nullable: true
          description: Preenchido depois que o PiggiesReserveService cria a reserva.
        failureReason:
          type: string
          nullable: true
          description: Preenchido quando status é FAILED.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PaymentStatus:
      type: string
      enum:
        - PROCESSING
        - CONFIRMED
        - FAILED
    PaymentConfirmEvent:
      type: object
      additionalProperties: false
      description: |
        Publicado pelo coordinator no tópico spp.payment.confirm depois que a
        reserva e a validação do merchant concluem com sucesso.
      required:
        - paymentId
        - reservationId
        - merchantCnpj
        - amount
      properties:
        paymentId:
          type: string
          format: uuid
        reservationId:
          type: string
          format: uuid
        merchantCnpj:
          type: string
          pattern: "^[0-9]{14}$"
        amount:
          type: integer
          format: int64
          minimum: 1
    PaymentConfirmedEvent:
      type: object
      additionalProperties: false
      description: |
        Consumido pelo coordinator no tópico spp.payment.confirmed. Ao receber,
        a intenção passa a CONFIRMED.
      required:
        - paymentId
        - merchantCnpj
        - amount
        - creditedAt
      properties:
        paymentId:
          type: string
          format: uuid
        merchantCnpj:
          type: string
          pattern: "^[0-9]{14}$"
        amount:
          type: integer
          format: int64
          minimum: 1
        creditedAt:
          type: string
          format: date-time
    Problem:
      type: object
      description: RFC 9457 application/problem+json
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
