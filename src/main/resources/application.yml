micronaut:
  application:
    name: livecode

datasources:
  default:
    url: ${JDBC_URL:`jdbc:postgresql://localhost:5432/postgres`}
    username: ${JDBC_USER:postgres}
    password: ${JDBC_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    db-type: postgres
    dialect: POSTGRES

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: update
          create_namespaces: true

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:`localhost:9092`}

spp:
  seed:
    enabled: true
  topics:
    payment-debited: spp.payment.debited
    payment-confirmed: spp.payment.confirmed

endpoints:
  health:
    details-visible: ANONYMOUS
