micronaut:
  application:
    name: livecode
  http:
    services:
      reserve:
        url: ${RESERVE_SERVICE_URL:`http://localhost:8080`}
      merchant:
        url: ${MERCHANT_SERVICE_URL:`http://localhost:8080`}

datasources:
  default:
    url: ${JDBC_URL:`jdbc:postgresql://localhost:5432/postgres`}
    username: ${JDBC_USER:postgres}
    password: ${JDBC_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    db-type: postgres
    dialect: POSTGRES

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: update

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:`localhost:9092`}

endpoints:
  health:
    details-visible: ANONYMOUS